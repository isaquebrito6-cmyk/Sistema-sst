<style>
:root{--bg:#EEF2F1;--sf:#FFFFFF;--sf2:#F6F9F8;--ink:#11242A;--ink2:#54676B;--line:#DBE3E1;--brand:#0B5560;--brand2:#083E46;--bi:#FFFFFF;--soft:#DDEBEC;--acc:#E8A62F;--side:#0A333A;--sideink:#CFE3E5;--danger:#B3261E;
--low:#3F8F5B;--med:#B58F0A;--high:#D9712B;--crit:#C2372F;--lows:#DDEFE3;--meds:#F7EDC6;--highs:#FBE3D0;--crits:#F8D9D6;--shadow:0 1px 2px rgba(11,38,43,.05),0 1px 1px rgba(11,38,43,.04);--shadow-md:0 4px 10px rgba(11,38,43,.06),0 1px 2px rgba(11,38,43,.05);--shadow-lg:0 24px 60px rgba(6,20,24,.28);--ease:cubic-bezier(.4,0,.2,1);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E191C;--sf:#162428;--sf2:#1B2D32;--ink:#E5EEEF;--ink2:#9DB1B4;--line:#2A3D42;--brand:#5EB9C5;--brand2:#7CCAD4;--bi:#06272C;--soft:#1C3B41;--acc:#F0B429;--side:#091316;--sideink:#B9CFD2;--danger:#F28B82;--low:#5DBB80;--med:#DDB93A;--high:#F09355;--crit:#F0766E;--lows:#1B3A28;--meds:#3B3410;--highs:#452B15;--crits:#472120;--shadow:0 1px 2px rgba(0,0,0,.35);--shadow-md:0 4px 12px rgba(0,0,0,.35);--shadow-lg:0 24px 60px rgba(0,0,0,.55);--ease:cubic-bezier(.4,0,.2,1);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E191C;--sf:#162428;--sf2:#1B2D32;--ink:#E5EEEF;--ink2:#9DB1B4;--line:#2A3D42;--brand:#5EB9C5;--brand2:#7CCAD4;--bi:#06272C;--soft:#1C3B41;--acc:#F0B429;--side:#091316;--sideink:#B9CFD2;--danger:#F28B82;--low:#5DBB80;--med:#DDB93A;--high:#F09355;--crit:#F0766E;--lows:#1B3A28;--meds:#3B3410;--highs:#452B15;--crits:#472120;--shadow:0 1px 2px rgba(0,0,0,.35);--shadow-md:0 4px 12px rgba(0,0,0,.35);--shadow-lg:0 24px 60px rgba(0,0,0,.55);--ease:cubic-bezier(.4,0,.2,1);color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);background:radial-gradient(1100px 620px at 100% -8%,color-mix(in srgb,var(--brand) 7%,var(--bg)) 0%,var(--bg) 55%),var(--bg);color:var(--ink);font:15px/1.5 'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;margin:0;letter-spacing:-.015em;line-height:1.2;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.layout{display:flex;min-height:100vh}
.side{width:250px;flex:none;background:var(--side);background:linear-gradient(185deg,var(--side) 0%,color-mix(in srgb,var(--side) 82%,#000) 100%);color:var(--sideink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;padding:18px 12px;display:flex;flex-direction:column;gap:4px;z-index:40;box-shadow:2px 0 14px rgba(0,0,0,.12)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand .mk{width:34px;height:34px;border-radius:9px;background:var(--acc);background:linear-gradient(155deg,color-mix(in srgb,var(--acc) 92%,#fff) 0%,var(--acc) 100%);display:grid;place-items:center;color:#11262B;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.brand b{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;color:#fff;display:block;line-height:1.1}
.brand span{font-size:11.5px;opacity:.75;line-height:1.2;display:block}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:9px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;font-weight:500;transition:background-color .15s var(--ease),box-shadow .15s var(--ease)}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--acc);font-weight:600}
.nav svg{width:19px;height:19px;flex:none}
.nav{position:relative}
.navbadge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;flex:none}
#install-btn{display:none;align-items:center;gap:9px;width:calc(100% - 4px);margin:6px 2px 2px;padding:9px 12px;border-radius:9px;border:1px dashed rgba(255,255,255,.35);background:rgba(255,255,255,.07);color:#fff;font-weight:600;font-size:13px;cursor:pointer;text-align:left}
#install-btn svg{width:18px;height:18px;flex:none}
#install-btn.show{display:flex}
.navbadge.warn{background:var(--acc);color:#11262B}
.side .sp{flex:1}
.navgroup{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.4);padding:16px 12px 5px;letter-spacing:.01em}
.navgroup:first-child{padding-top:2px}
.side small{opacity:.6;padding:8px 12px;font-size:11.5px;line-height:1.35}
.main{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,#fff);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 20px;flex-wrap:wrap;box-shadow:0 1px 0 rgba(11,38,43,.02)}
.top h1{font-size:21px;flex:1;min-width:120px;color:var(--ink)}
.menu{display:none}
.roles{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

async function initData(){

 try{

/* arquivos (ASO em PDF/imagem): guardados em pedaços no banco compartilhado */
const b64enc=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const b64dec=b=>{const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function putFile(file){
 if(file.size>3*1024*1024)throw new Error('O arquivo tem mais de 3 MB. Comprima o PDF ou envie uma foto menor.');
 const b64=b64enc(await file.arrayBuffer()),fid=uid();
 if(DB.db){const CH=180000,n=Math.max(1,Math.ceil(b64.length/CH));
  for(let i=0;i<n;i++)await DB.db.doc('arquivos/'+fid+'_'+i).set({fid,n:i,total:n,data:b64.slice(i*CH,(i+1)*CH)});
  return{fid,nome:file.name,mime:file.type||'application/pdf',size:file.size,n}}
 DB.mem[fid]=b64;try{localStorage.setItem('sst.f.'+fid,b64)}catch(e){}
 return{fid,nome:file.name,mime:file.type||'application/pdf',size:file.size,n:1}
}
async function getFile(m){
 let b64='';
 if(DB.db){const q=await DB.db.collection('arquivos').where('fid','==',m.fid).get();b64=q.docs.map(d=>d.data()).sort((a,b)=>a.n-b.n).map(p=>p.data).join('')}
 else b64=DB.mem[m.fid]||localStorage.getItem('sst.f.'+m.fid)||'';
 if(!b64)throw new Error('Arquivo não encontrado.');
 return new Blob([b64dec(b64)],{type:m.mime})
}
async function delFile(m){if(!m)return;try{if(DB.db){for(let i=0;i<(m.n||1);i++)await DB.db.doc('arquivos/'+m.fid+'_'+i).delete()}else{delete DB.mem[m.fid];localStorage.removeItem('sst.f.'+m.fid)}}catch(e){}}
async function saveAs(filename,data){
 try{if(DB.dl){await DB.dl.save({filename,data});return true}}catch(e){if(e&&e.code==='declined')return false;console.warn(e)}
 try{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){toast('Não foi possível baixar o arquivo neste ambiente.');return false}
}

function abrirEnt(kind,id,pre){
 const E=ENT[kind];const rec=id?clone(G(E.col,id)):Object.assign({},pre||{});
 if(kind==='colaborador'||kind==='acao'){if(S.role==='empresa')rec.empresaId=S.rid;else if(!rec.empresaId)rec.empresaId=S.emp||''}
 if(kind==='colaborador'&&!rec.status)rec.status='Ativo';
 if(kind==='acao'&&!rec.status)rec.status='Pendente';
 if(kind==='empresa'&&!rec.grau)rec.grau='2';
 let fields=E.f();
 if(kind==='colaborador'){
  const eid=rec.empresaId;
  const setores=eid?distVals(eid,'setor'):[],funcs=eid?distVals(eid,'funcao'):[];
  const novo=[['__novo__','+ Novo…']];
  fields=fields.flatMap(f=>{
   if(f.k==='setor')return [Object.assign({},f,{t:setores.length?'select':undefined,o:setores.length?setores.map(s=>[s,s]).concat(novo):undefined,ph:setores.length?'Selecione ou crie':undefined,c:'colNovo',r:1}),
     {k:'setorNovo',l:setores.length?'Nome do novo setor':'Setor / GHE',w:3,hideUnless:setores.length?'setor':null}];
   if(f.k==='funcao')return [Object.assign({},f,{t:funcs.length?'select':undefined,o:funcs.length?funcs.map(s=>[s,s]).concat(novo):undefined,ph:funcs.length?'Selecione ou crie':undefined,c:'colNovo',r:1}),
     {k:'funcaoNovo',l:funcs.length?'Nome da nova função':'Função / cargo',w:3,hideUnless:funcs.length?'funcao':null}];
   return [f];
  });
 }
 if(kind==='acao'&&rec.empresaId){
  const emp2=G('empresas',rec.empresaId);
  const nomes=[...new Set(L('colaboradores').filter(c=>c.empresaId===rec.empresaId).map(c=>c.nome).concat(emp2&&emp2.resp_nome?[emp2.resp_nome]:[]))].sort((a,b)=>norm(a).localeCompare(norm(b)));
  fields=fields.map(f=>f.k==='responsavel'?Object.assign({},f,{dl:nomes}):f);
 }
 openForm({title:(id?'Editar ':'Nova ')+E.t,fields,val:rec,save:v=>{
  if(kind==='colaborador'){
   if(v.setor==='__novo__')v.setor=(v.setorNovo||'').trim();
   if(v.funcao==='__novo__')v.funcao=(v.funcaoNovo||'').trim();
   delete v.setorNovo;delete v.funcaoNovo;
   if(!v.setor){toast('Informe o setor.');return false}
   if(!v.funcao){toast('Informe a função.');return false}
  }
  save(E.col,Object.assign(rec,v));toast('Salvo.');
 }});
}

function riscoLoteSalvar(empId){
 const setor=($('#rl_setor')||{}).value||'';

function abrirRisco(id,pre){
 const rec=id?clone(G('riscos',id)):Object.assign({empresaId:S.emp,cat:'fisico',exposicao:'Habitual e permanente',sev:'3',prob:'3',per:'12',exames:['clinico']},pre||{});
 const pre_=`<div class="fld" style="margin-bottom:12px"><label for="modelo">Começar de um modelo do catálogo</label><select id="modelo" data-c="modelo"><option value="">Selecione um perigo comum para preencher automaticamente…</option>${Object.entries(CATS).map(([k,n])=>`<optgroup label="${n}">${HAZ.filter(h=>h.cat===k).map(h=>`<option value="${h.id}">${esc(h.perigo)}</option>`).join('')}</optgroup>`).join('')}</select></div><div id="nvl" style="margin-bottom:12px"></div>`;
 const setoresExistentes=rec.empresaId?distVals(rec.empresaId,'setor'):[],funcsExistentes=rec.empresaId?distVals(rec.empresaId,'funcao'):[];
 const valForm=Object.assign({},rec,{
  setor_arr:setoresDe(rec).filter(s=>s!=='Sem setor'&&setoresExistentes.includes(s)),
  setorNovo:setoresDe(rec).filter(s=>s!=='Sem setor'&&!setoresExistentes.includes(s)).join(', '),
  funcoes_arr:String(rec.funcoes||'').split(/[,;\n]/).map(s=>s.trim()).filter(s=>s&&funcsExistentes.concat('todas').includes(s)),
  funcoesNovo:String(rec.funcoes||'').split(/[,;\n]/).map(s=>s.trim()).filter(s=>s&&!funcsExistentes.concat('todas').includes(s)).join(', ')
 });
 openForm({title:id?'Editar risco':'Novo risco no inventário',pre:pre_,fields:riscoFields(rec.empresaId),val:valForm,save:v=>{
  const setorFinal=[...(v.setor_arr||[]),...(v.setorNovo||'').split(/[,;\n]/).map(s=>s.trim())].filter(Boolean).join(', ');
  const funcoesFinal=[...(v.funcoes_arr||[]),...(v.funcoesNovo||'').split(/[,;\n]/).map(s=>s.trim())].filter(Boolean).join(', ');
  if(!setorFinal){toast('Informe ao menos um setor / GHE.');return false}
  delete v.setor_arr;delete v.setorNovo;delete v.funcoes_arr;delete v.funcoesNovo;
  v.setor=setorFinal;v.funcoes=funcoesFinal;
  if(v.exposicao===''||!v.per)v.per='12';
  save('riscos',Object.assign(rec,v));toast('Risco salvo.');
 }});
 nvlUpd();
}

function aplicarModelo(id){

function contagemUso(empId,campo,valor){
 const cols=L('colaboradores').filter(c=>c.empresaId===empId&&c[campo]===valor).length;
 const riscosCount=L('riscos').filter(r=>{
  if(r.empresaId!==empId)return false;
  const lista=campo==='setor'?setoresDe(r):String(r.funcoes||'').split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);
  return lista.includes(valor);
 }).length;
 return{cols,riscosCount};
}
function abrirGerenciarSetores(empId){renderGerenciarSetores(empId)}
function renderGerenciarSetores(empId){
 const setores=distVals(empId,'setor'),funcs=distVals(empId,'funcao');
 const secao=(campo,lista,titulo)=>{
  if(!lista.length)return `<p class="muted sm">Nenhum${titulo==='Setor'?'':'a'} ${titulo.toLowerCase()} cadastrad${titulo==='Setor'?'o':'a'} ainda.</p>`;
  return `<table class="tbl"><thead><tr><th>${titulo}</th><th>Em uso</th><th></th></tr></thead><tbody>${lista.map((v,i)=>{
   const u=contagemUso(empId,campo,v);const rid='ge_'+campo+'_'+i;
   return `<tr><td data-l="${titulo}"><input id="${rid}" value="${esc(v)}" style="min-width:160px"></td><td data-l="Em uso">${u.cols?`<span class="chip gray">${u.cols} colaborador(es)</span> `:''}${u.riscosCount?`<span class="chip gray">${u.riscosCount} risco(s)</span>`:''}${!u.cols&&!u.riscosCount?'<span class="muted sm">—</span>':''}</td><td class="act"><button type="button" class="btn s" data-a="geRenomear" data-emp="${empId}" data-campo="${campo}" data-old="${esc(v)}" data-in="${rid}">Salvar</button> <button type="button" class="btn s g d" data-a="geExcluir" data-emp="${empId}" data-campo="${campo}" data-val="${esc(v)}" aria-label="Excluir">${ic('trash')}</button></td></tr>`;
  }).join('')}</tbody></table>`;
 };
 $('#modal-root').innerHTML=`<div class="overlay"><div class="sheet" style="max-width:760px" role="dialog" aria-modal="true"><header><h2>Setores e funções — ${esc(nEmp(empId))}</h2><button type="button" class="btn g s" data-a="closeForm" aria-label="Fechar">${ic('x')}</button></header><div class="bd">
 <p class="muted sm" style="margin-top:0">Edite o texto e clique em <b>Salvar</b> para renomear em todos os colaboradores e riscos que usam esse valor (também serve para unir dois nomes iguais escritos diferente). A lixeira remove o setor/função dos riscos vinculados; só é permitida quando nenhum colaborador o utiliza.</p>
 <h3 style="font-size:14px;margin:14px 0 8px">Setores / GHE</h3>${secao('setor',setores,'Setor')}
 <h3 style="font-size:14px;margin:18px 0 8px">Funções</h3>${secao('funcao',funcs,'Função')}
 </div><footer><button class="btn p" data-a="closeForm">Concluído</button></footer></div></div>`;
}
function geRenomear(empId,campo,oldVal,inputId){
 const novo=($('#'+inputId)||{}).value.trim();
 if(!novo||novo===oldVal)return;
 const field=campo==='setor'?'setor':'funcoes';
 L('colaboradores').filter(c=>c.empresaId===empId&&c[campo]===oldVal).forEach(c=>{const n=clone(c);n[campo]=novo;save('colaboradores',n,true)});
 L('riscos').filter(r=>r.empresaId===empId).forEach(r=>{
  const lista=String(r[field]||'').split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);
  if(lista.includes(oldVal)){const n=clone(r);n[field]=[...new Set(lista.map(x=>x===oldVal?novo:x))].join(', ');save('riscos',n,true)}
 });
 render();toast('Renomeado para "'+novo+'".');
 renderGerenciarSetores(empId);
}
function geExcluir(empId,campo,val){
 const u=contagemUso(empId,campo,val);
 if(u.cols){toast(u.cols+' colaborador(es) ainda usam "'+val+'". Troque '+(campo==='setor'?'o setor':'a função')+' deles antes de excluir.',5000);return}
 ask('Excluir "'+val+'"'+(u.riscosCount?' de '+u.riscosCount+' risco(s)':'')+'? Os riscos não são apagados, só deixam de ter esse '+(campo==='setor'?'setor':'essa função')+'.','Excluir',()=>{
  const field=campo==='setor'?'setor':'funcoes';
  L('riscos').filter(r=>r.empresaId===empId).forEach(r=>{
   const lista=String(r[field]||'').split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);
   if(lista.includes(val)){const n=clone(r);n[field]=lista.filter(x=>x!==val).join(', ');save('riscos',n,true)}
  });
  render();toast('Removido.');
  renderGerenciarSetores(empId);
 });
}

VIEWS.documentos=()=>{
 const e=empAtual();
 if(!e)return emptyBox('Vamos montar o PGR da sua empresa','Use o formulário: ele reúne os dados da empresa e o inventário de riscos numa única tela e já gera o PGR ao salvar.',isC()?`<button class="btn p" data-a="formPGR">${ic('file')}Abrir formulário do PGR</button>`:'','file');
 const hist0=L('documentos').filter(d=>d.empresaId===e.id);
 const pgr0=hist0.filter(d=>d.tipo==='PGR').sort((a,b)=>b.rev-a.rev)[0];
 const pcmso0=hist0.filter(d=>d.tipo==='PCMSO').sort((a,b)=>b.rev-a.rev)[0];
 const riscosDesde=Math.max(0,...L('riscos').filter(r=>r.empresaId===e.id).map(r=>r.upd||0));
 const pcmsoDesatualizado=pcmso0&&riscosDesde&&(pcmso0.upd||0)<riscosDesde;
 const rs=L('riscos').filter(r=>r.empresaId===e.id),cs=L('colaboradores').filter(c=>c.empresaId===e.id);
 const ck=[[!!(e.cnpj&&e.razao),'Dados da empresa (razão social e CNPJ)'],[!!(e.medico_nome&&e.medico_crm),'Médico coordenador do PCMSO com CRM'],[!!e.tec_nome,'Responsável técnico do PGR'],[!!e.atividades,'Descrição das atividades'],[rs.length>0,'Inventário de riscos ('+rs.length+')'],[cs.length>0,'Colaboradores cadastrados ('+cs.length+')'],[!!pgr0,'PGR já emitido (o PCMSO deve se basear em um PGR emitido)']];
 const hist=L('documentos').filter(d=>d.empresaId===e.id).sort((a,b)=>b.emissao.localeCompare(a.emissao)||b.rev-a.rev);
 const rv=t=>Math.max(0,...hist.filter(d=>d.tipo===t).map(d=>d.rev));
 const card=(t,sub,lei)=>`<div class="card"><h3>${t}</h3><p class="sm muted" style="margin:0 0 10px">${sub}</p><p class="sm" style="margin:0 0 12px">Última revisão emitida: <b>${rv(t)?'Rev. '+String(rv(t)).padStart(2,'0'):'nenhuma'}</b></p><div class="row"><button class="btn s" data-a="verDoc" data-t="${t}">Visualizar minuta</button>${isC()?`<button class="btn s p" data-a="emitDoc" data-t="${t}">Emitir revisão ${String(rv(t)+1).padStart(2,'0')}</button>`:''}</div></div>`;
 return `<div class="bar">${empSel()}${isC()?`<button class="btn" data-a="formPGR">${ic('file')}Formulário do PGR</button>`:''}</div>
 ${isC()?`<div class="card" style="margin-bottom:16px"><h3>Conferência antes de emitir</h3><div class="checks">${ck.map(c=>`<div class="chk" style="${c[0]?'':'border-color:var(--high)'}"><span>${c[0]?'✔':'⚠'}</span><span>${c[1]}</span></div>`).join('')}</div><p class="sm muted" style="margin:10px 0 0">Itens pendentes não impedem a geração, mas ficam em branco no documento.</p></div>`:''}
 ${isC()&&pcmsoDesatualizado?`<div class="card" style="margin-bottom:16px;border-color:var(--high)"><b style="color:var(--high)">⚠ O inventário de riscos mudou depois da última emissão do PCMSO.</b><p class="sm muted" style="margin:4px 0 0">Os exames por função já refletem os riscos atuais na minuta, mas a revisão oficial do PCMSO ainda não foi emitida com essas mudanças. Emita uma nova revisão para manter o documento oficial atualizado.</p></div>`:''}
 <div class="grid">${isC()?card('PGR','Programa de Gerenciamento de Riscos: inventário de riscos e plano de ação (NR-1 GRO/PGR, com avaliações de agentes conforme NR-9).')+card('PCMSO','Programa de Controle Médico de Saúde Ocupacional (NR-7): exames por função, periodicidade e relatório analítico.'):''}
 <div class="card"><h3>Modelos em branco</h3><p class="sm muted" style="margin:0 0 10px">Para imprimir e preencher à mão.</p><div class="row"><button class="btn s" data-a="blank" data-t="aso">ASO</button><button class="btn s" data-a="blank" data-t="psico">Checklist psicossocial</button></div></div></div>
 <h2 style="font-size:17px;margin:22px 0 10px">Histórico de emissões</h2>`+(hist.length?tbl([{h:'Documento',f:d=>d.tipo+' — Rev. '+String(d.rev).padStart(2,'0')},{h:'Emissão',f:d=>fd(d.emissao)},{h:'Revisar até',f:d=>fd(addM(d.emissao,d.tipo==='PGR'?24:12))},{h:'',a:1,f:d=>`<button class="btn s" data-a="reabrirDoc" data-id="${d.id}">Abrir</button>`}],hist):'<p class="muted">Nenhum documento emitido ainda.</p>');
};

function renderDetalhe(){

 h+='<div class="pb"></div>';
 h+=`<div class="note warn"><b>⚠ Leia antes de usar este documento.</b> Esta é uma minuta gerada automaticamente a partir dos dados informados no sistema e deve ser revisada e assinada por profissional legalmente habilitado antes de valer como o PGR oficial da organização. O documento não substitui: (1) a avaliação quantitativa das exposições ocupacionais, quando exigida (ruído, calor por IBUTG, vibração, agentes químicos), que depende de medição em campo por profissional habilitado; (2) os Anexos IV (condições hiperbáricas) e V (substâncias cancerígenas e radiações ionizantes) da NR-7, que exigem tratamento técnico específico e não são gerados automaticamente; e (3) a análise crítica do responsável técnico sobre a adequação das medidas de prevenção descritas.</div>`;
 h+=`<h2>1. Identificação da organização</h2>${kv([['Razão social',esc(e.razao)],['Nome fantasia',esc(e.fantasia||'—')],['CNPJ',esc(e.cnpj||'—')],['CNAE / Grau de risco (NR-4)',esc((e.cnae||'—')+' / '+(e.grau||'—'))],['Endereço',esc(endEmp(e)||'—')],['Nº de trabalhadores',esc(e.funcionarios||L('colaboradores').filter(x=>x.empresaId===e.id&&x.status!=='Desligado').length)],['Jornada de trabalho',esc(e.jornada||'—')],['CIPA',esc(e.cipa||'—')],['Responsável pela empresa',esc((e.resp_nome||'—')+(e.resp_cargo?' — '+e.resp_cargo:''))],['Médico coordenador do PCMSO',esc((e.medico_nome||'—')+(e.medico_crm?' — '+e.medico_crm:''))]])}`;
 h+=`<h2>2. Objetivo e campo de aplicação</h2><p>Este Programa de Gerenciamento de Riscos (PGR) estabelece a sistemática de identificação de perigos, avaliação de riscos ocupacionais e definição de medidas de prevenção da organização, integrando o Gerenciamento de Riscos Ocupacionais (GRO) previsto na NR-1. Aplica-se a todos os setores, atividades e trabalhadores do estabelecimento, incluindo, quando pertinente, terceirizados e visitantes expostos aos mesmos riscos.</p><p>O PGR é composto pelo inventário de riscos ocupacionais e pelo plano de ação, e serve de base para o Programa de Controle Médico de Saúde Ocupacional (PCMSO), elaborado conforme a NR-7.</p>`;
 h+=`<h2>3. Referências normativas</h2><ul><li>NR-1, Capítulo 1.5 — Gerenciamento de Riscos Ocupacionais (GRO), que estabelece a estrutura, o conteúdo mínimo e a metodologia deste PGR, incluindo os fatores de risco ergonômicos e psicossociais relacionados ao trabalho;</li><li>NR-4 — Serviços Especializados em Segurança e em Medicina do Trabalho;</li><li>NR-5 — Comissão Interna de Prevenção de Acidentes e de Assédio (CIPA);</li><li>NR-6 — Equipamentos de Proteção Individual;</li><li>NR-7 — Programa de Controle Médico de Saúde Ocupacional (PCMSO), elaborado com base neste PGR (item 7.5.1 da NR-7);</li><li>NR-9 — Avaliação e controle das exposições ocupacionais a agentes físicos, químicos e biológicos identificados neste PGR (item 9.1.1 da NR-9);</li><li>NR-15 e NR-16 — Atividades e operações insalubres e perigosas, quando aplicável;</li><li>NR-17 — Ergonomia; e demais normas regulamentadoras aplicáveis às atividades da organização.</li></ul>`;
 h+=`<h2>4. Responsabilidades</h2><h3>Da organização</h3><ul><li>Implementar o PGR, disponibilizar recursos e cumprir o plano de ação nos prazos definidos;</li><li>Informar os trabalhadores sobre os riscos ocupacionais e as medidas de prevenção, e garantir treinamentos;</li><li>Fornecer gratuitamente os EPIs adequados e exigir seu uso, quando as medidas coletivas não forem suficientes.</li></ul><h3>Do responsável técnico</h3><ul><li>Elaborar e revisar o inventário de riscos e o plano de ação, mantendo o histórico das versões;</li><li>Acompanhar a eficácia das medidas de prevenção e recomendar melhorias.</li></ul><h3>Dos trabalhadores</h3><ul><li>Cumprir as orientações de segurança, utilizar corretamente os EPIs e comunicar situações de risco grave e iminente.</li></ul>`;
 h+=`<h2>5. Levantamento preliminar de perigos e riscos</h2><p>Antes da identificação detalhada, é realizado o levantamento preliminar de perigos e riscos (item 1.5.4.2 da NR-1), com o objetivo de identificar situações em que é possível evitar ou eliminar o perigo de imediato, e de apontar riscos ocupacionais evidentes — óbvios e não controlados — que exijam adoção imediata de medidas de redução ou controle, ainda que a análise aprofundada seja concluída posteriormente. Quando não for possível eliminar o perigo ou adotar medida imediata, o risco é inserido no plano de ação e registrado no inventário abaixo.</p>
 <h2>6. Identificação de perigos</h2><p>Para cada perigo identificado, o inventário de riscos registra, conforme o item 1.5.4.3 da NR-1: (a) a descrição do perigo e os possíveis danos ou agravos à saúde; (b) a identificação das fontes e/ou circunstâncias geradoras; e (c) a indicação do grupo de trabalhadores sujeitos ao perigo. Para os perigos relativos a agentes físicos, químicos e biológicos, essa identificação é detalhada conforme o item 9.3.1 da NR-9, incluindo a descrição das atividades de exposição, o agente e a forma de exposição, e os fatores determinantes da exposição (fonte, tempo e intensidade).</p>
 <h2>7. Avaliação dos riscos ocupacionais</h2><p>Para cada perigo identificado é indicado o nível de risco, determinado pela combinação da severidade das possíveis lesões ou agravos com a probabilidade de sua ocorrência (item 1.5.4.4.2 da NR-1). Para os riscos decorrentes de agentes físicos, químicos e biológicos, a probabilidade é estabelecida comparando o perfil de exposição ocupacional a valores de referência (item 1.5.4.4.5.2), mediante análise preliminar e, quando esta não for suficiente para a tomada de decisão, avaliação quantitativa, comparando os resultados aos limites de exposição ocupacional previstos na NR-15 e, na ausência destes, aos valores de referência da American Conference of Governmental Industrial Hygienists (ACGIH), conforme o item 9.6.1.1 da NR-9. Considera-se <b>nível de ação</b> o valor acima do qual devem ser implementadas ações de controle sistemático, correspondente, na ausência de valor específico no Anexo aplicável da NR-9, à metade do limite de tolerância para agentes químicos ou à metade da dose para o agente físico ruído (item 9.6.1 da NR-9). Para os riscos decorrentes de fatores ergonômicos, incluindo os fatores de risco psicossociais, e de acidentes, a probabilidade considera as exigências da atividade e a exposição do trabalhador, respectivamente, e a eficácia das medidas de prevenção já implementadas (itens 1.5.4.4.5.3 e 1.5.4.4.5.4). Os resultados das avaliações são incorporados a este inventário de riscos, no campo "Avaliação quantitativa ou qualitativa" de cada item.</p>
 <h2>8. Classificação e priorização dos riscos</h2><p>Como ferramenta complementar de priorização, cada risco identificado é também classificado pelo produto entre a <b>severidade</b> (gravidade provável do dano) e a <b>probabilidade</b> (chance de ocorrência considerando as medidas existentes), em escala de 1 a 5, permitindo ordenar as ações do plano previsto no item 9 deste documento.</p><table><tr><th>Nível</th><th>Severidade (S)</th><th>Probabilidade (P)</th></tr><tr><td>1</td><td>Leve — sem afastamento</td><td>Rara</td></tr><tr><td>2</td><td>Baixa — primeiros socorros</td><td>Pouco provável</td></tr><tr><td>3</td><td>Moderada — lesão com afastamento temporário</td><td>Possível</td></tr><tr><td>4</td><td>Grave — lesão ou doença com sequela</td><td>Provável</td></tr><tr><td>5</td><td>Gravíssima — invalidez ou óbito</td><td>Quase certa</td></tr></table>${pontosMatriz()}<table><tr><th>Nível de risco</th><th>Pontuação</th><th>Conduta</th></tr><tr><td><span class="tag m-low">Baixo</span></td><td>1 a 4</td><td>Manter as medidas existentes e monitorar.</td></tr><tr><td><span class="tag m-med">Médio</span></td><td>5 a 9</td><td>Planejar melhorias e monitorar periodicamente.</td></tr><tr><td><span class="tag m-high">Alto</span></td><td>10 a 15</td><td>Ação prioritária, com prazo curto e acompanhamento.</td></tr><tr><td><span class="tag m-crit">Crítico</span></td><td>16 a 25</td><td>Ação imediata; avaliar a interrupção da atividade até o controle do risco.</td></tr></table>`;
 {const anx=[];const has=k=>rs.some(r=>r.cat===k);
  if(rs.some(r=>norm(r.perigo).includes('vibra')))anx.push('Anexo I da NR-9 (Vibração em mãos e braços e de corpo inteiro) — avaliação preliminar obrigatória e, se necessária, avaliação quantitativa segundo as Normas de Higiene Ocupacional da Fundacentro.');
  if(rs.some(r=>norm(r.perigo).includes('calor')))anx.push('Anexo III da NR-9 (Calor) — avaliação pelo índice IBUTG conforme a NHO-06 da Fundacentro, com medidas quando excedidos os níveis de ação e limites de exposição do Anexo.');
  if(rs.some(r=>norm(r.perigo).includes('ruído')||norm(r.perigo).includes('ruido')))anx.push('Ruído: enquanto não há Anexo específico publicado na NR-9, aplicam-se os limites de tolerância da NR-15 e, como nível de ação, a metade da dose (item 9.6.1 da NR-9), com vigilância médica conforme o Anexo II da NR-7.');
  if(anx.length)h+=`<h2>9. Anexos técnicos aplicáveis</h2><p>Em razão dos perigos identificados nesta organização, aplicam-se adicionalmente:</p><ul>${anx.map(t=>'<li>'+t+'</li>').join('')}</ul>`;
 }
 h+=`<h2>10. Caracterização da organização</h2><h3>Atividades e processo produtivo</h3><p>${e.atividades?nl(e.atividades):'<span class="blank l"></span>'}</p><h3>Estabelecimento e instalações</h3><p>${e.instal?nl(e.instal):'<span class="blank l"></span>'}</p><h3>Setores e funções</h3>${grp.length?`<table><tr><th>Setor / GHE</th><th>Função</th><th>Trabalhadores</th></tr>${grp.map(g=>`<tr><td>${esc(g.setor)}</td><td>${esc(g.funcao)}</td><td>${g.n||'—'}</td></tr>`).join('')}</table>`:'<p class="small">Nenhum colaborador cadastrado.</p>'}`;
 h+=`<h2>11. Inventário de riscos ocupacionais</h2><p class="small">Consolida os dados de identificação de perigos e avaliação de riscos, com o conteúdo mínimo do item 1.5.7.3.2 da NR-1: caracterização dos processos, ambientes e atividades; descrição dos perigos e fontes; possíveis danos à saúde; grupos expostos; medidas de prevenção existentes; caracterização da exposição; e a avaliação de risco para fins do plano de ação.</p>`;
 if(!rs.length)h+='<p class="small">Nenhum risco cadastrado no inventário.</p>';
 sets.forEach(s=>{
  h+=`<h3>Setor / GHE: ${esc(s)}</h3><table><tr><th style="width:15%">Grupo exposto (funções/atividades)</th><th style="width:22%">Agente/perigo e forma de exposição</th><th style="width:16%">Possíveis danos à saúde</th><th style="width:16%">Exposição e avaliação</th><th style="width:19%">Medidas de prevenção existentes</th><th style="width:12%">Nível (S×P)</th></tr>`+
  rs.filter(r=>setoresDe(r).includes(s)).map(r=>`<tr><td>${esc(r.funcoes||'Todo o setor')}${r.atividades?'<br><span class="small">'+esc(r.atividades)+'</span>':''}</td><td><b>${esc(r.perigo)}</b><br><span class="small">${esc(CATS[r.cat]||'')}${r.fonte?' — '+esc(r.fonte):''}</span></td><td>${esc(r.danos||'—')}</td><td>${esc(r.exposicao||'—')}${r.aval?'<br><span class="small">'+esc(r.aval)+'</span>':''}</td><td>${esc(r.medidas||'—')}</td><td>${lvl(r.sev,r.prob)}<br><span class="small">S${esc(r.sev)} × P${esc(r.prob)}</span></td></tr>`).join('')+'</table>';
 });
 if(rs.length)h+=`<h3>Resumo</h3><table><tr><th>Baixo</th><th>Médio</th><th>Alto</th><th>Crítico</th><th>Total</th></tr><tr><td>${cnt.low}</td><td>${cnt.med}</td><td>${cnt.high}</td><td>${cnt.crit}</td><td>${rs.length}</td></tr></table><table><tr>${porCat.map(p=>`<th>${p[0]}</th>`).join('')}</tr><tr>${porCat.map(p=>`<td>${p[1]}</td>`).join('')}</tr></table>`;
 h+=`<h2>12. Plano de ação</h2><p>As medidas de prevenção e controle das exposições ocupacionais integram o inventário de riscos e são incorporadas a este plano de ação (item 9.5.3 da NR-9), seguindo a ordem de prioridade prevista na NR-1: eliminação dos fatores de risco; minimização e controle na fonte; redução do tempo de exposição, sendo aceitável quando não for possível eliminar ou reduzir a exposição a limites aceitáveis; medidas de proteção coletiva; medidas administrativas ou de organização do trabalho; e, por último, medidas de proteção individual (EPI).</p>`;
 h+=ac.length?`<table><tr><th style="width:4%">Nº</th><th>Ação / medida de prevenção</th><th style="width:16%">Responsável</th><th style="width:12%">Prazo</th><th style="width:13%">Situação</th></tr>${ac.map((a,i)=>`<tr><td>${i+1}</td><td>${nl(a.acao)}${a.result?'<br><span class="small">Acompanhamento: '+esc(a.result)+'</span>':''}</td><td>${esc(a.responsavel||'—')}</td><td>${fd(a.prazo)}</td><td>${esc(a.status)}</td></tr>`).join('')}</table>`:'<p class="small">Nenhuma ação cadastrada. Riscos classificados como Alto ou Crítico exigem plano de ação com prazo e responsável.</p>';
 h+=`<p>O acompanhamento é feito pelo responsável técnico em conjunto com a organização, com registro da situação de cada ação e verificação da eficácia das medidas após a implantação.</p>`;
 h+=`<h2>13. Preparação para emergências</h2><p>${e.emerg?nl(e.emerg):'A organização deve manter procedimentos de resposta a emergências, incluindo, no mínimo, os meios, responsáveis e recursos para primeiros socorros, encaminhamento de acidentados e abandono dos locais afetados (item 1.5.6.2 da NR-1), além das medidas para emergências de grande magnitude, quando aplicável.'}</p><p>São realizados exercícios simulados com a periodicidade definida no procedimento de resposta a emergências, com registro das evidências de cada exercício (itens 1.5.6.3 e 1.5.6.3.1 da NR-1).</p>`;
 h+=`<h2>14. Participação, comunicação e monitoramento</h2><ul><li>Os trabalhadores participam do gerenciamento de riscos por meio de noções básicas sobre o processo, e são consultados quanto à sua percepção dos riscos, inclusive pelas manifestações da CIPA, quando houver (item 1.5.3.3 da NR-1);</li><li>Os riscos consolidados no inventário e as medidas de prevenção do plano de ação são comunicados aos trabalhadores, também por ordens de serviço, treinamentos e diálogos de segurança;</li><li>O PGR é mantido à disposição dos trabalhadores, dos sindicatos representantes das categorias profissionais e da Inspeção do Trabalho (item 1.5.7.2.1), e integra-se às ações do PCMSO e da CIPA;</li><li>A implementação das medidas de prevenção e os respectivos ajustes são registrados, e seu desempenho é acompanhado de forma planejada, incluindo inspeções dos locais e equipamentos de trabalho e o monitoramento das condições ambientais, com correção das medidas quando constatada ineficácia (item 1.5.5.3 da NR-1);</li><li>Acidentes e doenças relacionadas ao trabalho são analisados e documentados, considerando as situações geradoras, os dados epidemiológicos e as informações dos trabalhadores, para revisar e aprimorar as medidas de prevenção (item 1.5.5.5 da NR-1).</li></ul>
 <h2>15. Revisão do PGR</h2><p>A avaliação de riscos constitui processo contínuo e é revista, no mínimo, a cada 2 (dois) anos — prazo que pode ser estendido para até 3 (três) anos para organizações certificadas em sistema de gestão de SST — e sempre que ocorrer uma das seguintes situações (item 1.5.4.4.6 da NR-1): após a implementação de medidas de prevenção, para avaliação dos riscos residuais; após inovações ou modificações em tecnologias, ambientes, processos ou na organização do trabalho que impliquem novos riscos ou alterem os existentes; quando identificadas inadequação, insuficiência ou ineficácia das medidas de prevenção; na ocorrência de acidentes ou doenças relacionadas ao trabalho; quando houver mudança nos requisitos legais aplicáveis; ou após solicitação justificada dos trabalhadores ou da CIPA, quando houver. O histórico das atualizações do inventário de riscos é mantido pela organização por, no mínimo, 20 (vinte) anos, ou pelo prazo estabelecido em normatização específica (item 1.5.7.3.3.1).</p>`;
 if(['1','2'].includes(String(e.grau))){
  h+=`<p class="small">Tratamento diferenciado (item 1.8 da NR-1): organizações de grau de risco 1 ou 2 que, no levantamento preliminar, não identificarem exposição a agentes físicos, químicos e biológicos, e que declararem as informações digitais de SST na forma do item 1.6.1, ficam dispensadas da elaboração formal do PGR; se também não identificarem riscos relacionados a fatores ergonômicos, ficam dispensadas do PCMSO, sem prejuízo da realização dos exames médicos e da emissão do ASO. O Microempreendedor Individual (MEI) está dispensado da elaboração do PGR em qualquer hipótese, devendo a organização contratante incluí-lo em seu próprio PGR quando atuar em suas dependências.</p>`;
 }
 h+=`<div class="note">Documento elaborado a partir dos dados informados pela organização e das avaliações registradas no inventário de riscos. A validade legal depende da revisão técnica e da assinatura do responsável indicado abaixo.</div>`;
 h+=`<h2>16. Aprovação</h2><p>Local e data: ${esc(e.cidade||'__________________')}, ${fd(meta.emissao)}.</p>${assin(e)}`;
 return h;
}

/* ---------- PCMSO ---------- */
function docPCMSO(e,meta){
 const rs=L('riscos').filter(r=>r.empresaId===e.id).sort((a,b)=>norm(a.setor).localeCompare(norm(b.setor)));
 const grp=gruposFuncao(e);const c=CFG();
 const pgrDocs=L('documentos').filter(d=>d.empresaId===e.id&&d.tipo==='PGR').sort((a,b)=>b.rev-a.rev||b.emissao.localeCompare(a.emissao));
 const pgrRef=pgrDocs[0];
 const cols=L('colaboradores').filter(x=>x.empresaId===e.id&&x.status!=='Desligado');
 const ano=L('solicitacoes').filter(s=>s.empresaId===e.id&&s.status==='Realizado'&&s.aso&&s.aso.data&&dias(s.aso.data)>=-365);
 const cl=[...new Set(L('solicitacoes').filter(s=>s.empresaId===e.id).map(s=>s.clinicaId))].map(id=>G('clinicas',id)).filter(Boolean);
 let h=dHead('PCMSO — Programa de Controle Médico de Saúde Ocupacional','Rev. '+String(meta.rev).padStart(2,'0'));
 h+=`<div class="cover"><p class="kk">Vigilância da saúde dos trabalhadores</p><h1>Programa de Controle Médico de Saúde Ocupacional</h1><p class="sub">NR-7 — Programa de Controle Médico de Saúde Ocupacional (PCMSO)</p><div class="emp"><b>${esc(e.razao)}</b>CNPJ ${esc(e.cnpj||'—')}<br>${esc(endEmp(e))}</div>${kv([['Revisão','Rev. '+String(meta.rev).padStart(2,'0')+(meta.rascunho?' — MINUTA (não emitida)':'')],['Data de emissão',fd(meta.emissao)],['Relatório analítico até',fd(addM(meta.emissao,12))],['Médico coordenador',esc((e.medico_nome||'—')+(e.medico_crm?' — '+e.medico_crm:''))],['Baseado no PGR',pgrRef?('Rev. '+String(pgrRef.rev).padStart(2,'0')+' — emitido em '+fd(pgrRef.emissao)):'PGR ainda não emitido — usando o inventário de riscos atual'],['Elaborado por',esc(c.nome||'—')]])}</div>`;
 h+='<div class="pb"></div>';
 h+=`<div class="note warn"><b>⚠ Leia antes de usar este documento.</b> Esta é uma minuta gerada automaticamente a partir do inventário de riscos do PGR e dos dados informados no sistema. Deve ser revisada e assinada pelo médico coordenador antes de valer como o PCMSO oficial da organização. Os exames e a periodicidade indicados são calculados a partir dos riscos cadastrados; a definição final de cada exame complementar, sua periodicidade e a interpretação clínica são atribuição exclusiva do médico coordenador (item 7.5.4, "c", da NR-7). Situações que exijam os Anexos IV (condições hiperbáricas) ou V (cancerígenos e radiações ionizantes) da NR-7 não são calculadas automaticamente.</div>`;
 h+=`<h2>1. Identificação</h2>${kv([['Razão social',esc(e.razao)],['CNPJ',esc(e.cnpj||'—')],['CNAE / Grau de risco',esc((e.cnae||'—')+' / '+(e.grau||'—'))],['Endereço',esc(endEmp(e)||'—')],['Nº de trabalhadores',esc(e.funcionarios||cols.length)],['Jornada',esc(e.jornada||'—')],['Médico coordenador do PCMSO',esc((e.medico_nome||'—')+(e.medico_crm?' — '+e.medico_crm:''))],['Clínicas / médicos examinadores',cl.length?cl.map(x=>esc(x.nome)+(x.medico_nome?' ('+esc(x.medico_nome)+')':'')).join('; '):'A definir pela organização']])}`;
 h+=`<h2>2. Objetivo e diretrizes</h2><p>Este PCMSO estabelece as diretrizes para proteger e preservar a saúde dos trabalhadores da organização frente aos riscos ocupacionais identificados e classificados no inventário de riscos do PGR (item 7.5.1 da NR-7), sendo parte do conjunto mais amplo de iniciativas da organização no campo da saúde dos trabalhadores, harmonizado com as demais Normas Regulamentadoras (item 7.3.1).</p><p>São diretrizes do programa (item 7.3.2 da NR-7): rastrear e detectar precocemente agravos à saúde relacionados ao trabalho; detectar possíveis exposições excessivas a agentes nocivos ocupacionais; definir a aptidão de cada trabalhador para suas funções; subsidiar a implantação e o monitoramento da eficácia das medidas de prevenção; subsidiar análises epidemiológicas e estatísticas; subsidiar decisões sobre afastamento de trabalhadores de situações que comprometam sua saúde; subsidiar a emissão de notificações de agravos relacionados ao trabalho e o encaminhamento à Previdência Social; acompanhar de forma diferenciada o trabalhador cujo estado de saúde possa ser especialmente afetado pelos riscos ocupacionais; subsidiar ações de reabilitação e readaptação profissional; e controlar a imunização ativa dos trabalhadores relacionada a riscos ocupacionais, quando recomendada pelo Ministério da Saúde.</p><p>O programa inclui ações de vigilância passiva (demanda espontânea de trabalhadores) e de vigilância ativa (exames médicos dirigidos, incluindo a coleta de sinais e sintomas relacionados aos riscos ocupacionais), e não deve, em nenhuma hipótese, ter caráter de seleção de pessoal (itens 7.3.2.1 e 7.3.2.2 da NR-7).</p>`;
 h+=`<h2>3. Responsabilidades</h2><p>Compete à organização (item 7.4.1 da NR-7): garantir a elaboração e a efetiva implantação do PCMSO; custear, sem qualquer ônus para o trabalhador, todos os procedimentos relacionados ao programa; e indicar o médico do trabalho responsável pelo PCMSO. Complementarmente:</p><ul><li><b>Organização:</b> encaminhar os trabalhadores aos exames nos prazos definidos; fornecer ao médico responsável as informações sobre riscos, processos e mudanças relevantes; manter os ASOs e prontuários arquivados e à disposição da fiscalização;</li><li><b>Médico coordenador do PCMSO:</b> planejar o programa com base nos riscos do PGR; definir exames complementares e periodicidades conforme os Anexos desta Norma; analisar os resultados e critérios de conduta; reavaliar inconsistências do inventário de riscos junto aos responsáveis pelo PGR (item 7.5.5); elaborar o relatório analítico anual;</li><li><b>Médico examinador:</b> realizar o exame clínico ocupacional, avaliar os exames complementares e emitir o ASO, atendendo ao planejamento definido pelo médico coordenador;</li><li><b>Trabalhador:</b> comparecer aos exames, informar seu histórico de saúde e seguir as orientações médicas.</li></ul>`;
 h+=`<h2>4. Riscos ocupacionais de referência (PGR)</h2><p class="small">Este PCMSO é elaborado com base no inventário de riscos do PGR desta organização (item 7.5.1 da NR-7)${pgrRef?', consolidado no PGR Rev. '+String(pgrRef.rev).padStart(2,'0')+', emitido em '+fd(pgrRef.emissao):''}. Qualquer alteração no inventário de riscos deve ser refletida na próxima emissão deste PCMSO.</p>${rs.length?`<table><tr><th>Setor / GHE</th><th>Perigo / fator de risco</th><th>Categoria</th><th>Risco</th></tr>${rs.map(r=>`<tr><td>${esc(r.setor||'—')}</td><td>${esc(r.perigo)}</td><td>${esc(CATS[r.cat]||'')}</td><td>${lvl(r.sev,r.prob)}</td></tr>`).join('')}</table>`:'<p class="small">Inventário de riscos ainda não cadastrado.</p>'}`;
 h+=`<h2>5. Programa de exames por setor e função</h2><p>Os exames abaixo são indicados a partir dos riscos de cada função. Os exames complementares e sua periodicidade podem ser ajustados pelo médico coordenador, mediante justificativa técnica.</p>${grp.length?`<table><tr><th style="width:24%">Setor / função</th><th style="width:9%">Trab.</th><th>Exames e periodicidade</th></tr>${grp.map(g=>{const rr=riscosDoColab(g.c),m=examesDe(rr);return `<tr><td><b>${esc(g.funcao)}</b><br><span class="small">${esc(g.setor)}</span></td><td>${g.n||'—'}</td><td>${chavesOrd(m).map(k=>`${chk(true)} ${esc(EXAMES[k].n)} — ${per(m[k])}${k==='clinico'?'':'<span class="small"> (motivo: '+esc(origemExame(rr,k).join('; ')||'—')+')</span>'}`).join('<br>')}</td></tr>`}).join('')}</table>`:'<p class="small">Cadastre colaboradores e o inventário de riscos para gerar este quadro.</p>'}`;
 h+=`<h2>6. Exames clínicos ocupacionais</h2><p class="small">Periodicidade do exame clínico (item 7.5.8 da NR-7): trabalhadores expostos a riscos ocupacionais classificados no PGR e portadores de doenças crônicas que aumentem a suscetibilidade a esses riscos — a cada ano ou em intervalo menor, a critério do médico coordenador; demais trabalhadores, sem exposição a riscos classificados no PGR — a cada dois anos.</p><table><tr><th style="width:22%">Tipo</th><th>Momento de realização</th></tr><tr><td>Admissional</td><td>Antes de o trabalhador assumir suas atividades.</td></tr><tr><td>Periódico</td><td>Conforme a periodicidade do item 5 acima, definida por função a partir dos riscos do PGR.</td></tr><tr><td>Retorno ao trabalho</td><td>Antes de o trabalhador reassumir suas funções, quando ausente por 30 dias ou mais por doença ou acidente, ocupacional ou não.</td></tr><tr><td>Mudança de risco ocupacional</td><td>Obrigatoriamente antes da data da mudança, adequando o controle médico aos novos riscos.</td></tr><tr><td>Demissional</td><td>Em até 10 dias contados do término do contrato, podendo ser dispensado se o exame ocupacional mais recente tiver sido realizado há menos de 135 dias (organização grau de risco 1 ou 2) ou 90 dias (grau de risco 3 ou 4).</td></tr></table><p class="small">Os exames dos Quadros 1 e 2 do Anexo I da NR-7 (indicadores biológicos de exposição) devem ser realizados a cada 6 meses, podendo ser antecipados ou postergados em até 45 dias a critério médico, mediante justificativa técnica.</p>`;
 h+=`<h2>7. Atestado de Saúde Ocupacional (ASO)</h2><p>Para cada exame clínico ocupacional, o médico emite o ASO, que deve conter no mínimo (item 7.5.19.1 da NR-7): razão social e CNPJ ou CAEPF da organização; nome completo, CPF e função do trabalhador; descrição dos perigos ou fatores de risco identificados e classificados no PGR que necessitem de controle médico previsto neste PCMSO, ou a sua inexistência; indicação e data de realização dos exames clínicos e complementares; definição de apto ou inapto para a função; nome e número de registro profissional do médico coordenador do PCMSO, se houver; e data, registro profissional e assinatura do médico que realizou o exame clínico.</p><p>O ASO deve ser comprovadamente disponibilizado ao trabalhador, fornecido em meio físico quando solicitado. Quando forem realizados exames complementares sem exame clínico, a organização emite recibo de entrega do resultado ao trabalhador.</p>`;
 h+=`<h2>8. Critérios de interpretação e condutas</h2><p>Os achados dos exames médicos são interpretados pelo médico responsável pelo PCMSO, que define a conduta em cada caso, observando em especial:</p><ul><li>Trabalhador considerado <b>inapto</b>: a organização adota as medidas cabíveis, incluindo eventual mudança de função, antes de mantê-lo na atividade;</li><li><b>Exposição excessiva</b> aos agentes do Quadro 1 do Anexo I da NR-7 (indicadores biológicos de exposição excessiva): o médico coordenador informa o fato aos responsáveis pelo PGR, para reavaliação dos riscos ocupacionais e das medidas de prevenção (item 7.5.19.4);</li><li><b>Doença relacionada ao trabalho ou disfunção orgânica</b> constatada pelos exames do Quadro 2 do Anexo I ou demais exames complementares: a organização, após informada pelo médico, emite a Comunicação de Acidente do Trabalho (CAT) quando cabível, afasta o trabalhador da situação quando necessário, encaminha-o à Previdência Social se o afastamento superar 15 dias, e reavalia os riscos e as medidas de prevenção no PGR (item 7.5.19.5); o trabalhador é então submetido a novo exame clínico e informado sobre o significado dos achados;</li><li>Nessas situações, o médico avalia também a necessidade de exame em outros trabalhadores sujeitos à mesma condição de trabalho (item 7.5.19.6.1).</li></ul>`;
 h+=`<h2>9. Prontuário médico, sigilo e primeiros socorros</h2><p>Os dados dos exames clínicos e complementares são registrados em prontuário médico individual sob responsabilidade do médico coordenador do PCMSO, podendo ser mantidos em meio eletrônico desde que atendidas as exigências do Conselho Federal de Medicina (item 7.6.1.3). O prontuário é conservado pela organização por, no mínimo, 20 (vinte) anos após o desligamento do trabalhador, exceto prazo diverso previsto nos Anexos desta Norma — como 40 anos para exposição a substâncias químicas cancerígenas e até os 75 anos de idade do trabalhador, ou no mínimo 30 anos após o desligamento, para exposição a radiações ionizantes (Anexo V da NR-7). Em caso de substituição do médico coordenador, a organização garante a transferência formal dos prontuários ao sucessor (item 7.6.1.2). Os dados de saúde são sigilosos, tratados conforme a Lei Geral de Proteção de Dados (LGPD). A organização mantém recursos e pessoal treinado para primeiros socorros, conforme a natureza das atividades.</p>`;
 // relatório analítico
 const tipos=TIPOS.map(t=>[t,ano.filter(s=>s.tipo===t).length]);
 const ap=ano.filter(s=>s.aso.resultado==='Apto').length,ina=ano.filter(s=>s.aso.resultado==='Inapto').length;
 const ex={};ano.forEach(s=>Object.keys(s.aso.exames||{}).forEach(k=>ex[k]=(ex[k]||0)+1));
 const porSetor={};ano.forEach(s=>{const c2=G('colaboradores',s.colabId)||{};const k=c2.setor||'—';porSetor[k]=(porSetor[k]||0)+1});
 const simplif=(['1','2'].includes(String(e.grau))&&cols.length<=25)||(['3','4'].includes(String(e.grau))&&cols.length<=10);
 h+=`<h2>10. Relatório analítico anual</h2><p>Elaborado pelo médico coordenador do PCMSO, considerando a data do último relatório (item 7.6.2 da NR-7). Consolidado dos exames registrados no sistema entre ${fd(addM(meta.emissao,-12))} e ${fd(meta.emissao)}.</p>
 <h3>a) Número de exames clínicos realizados, por tipo</h3><table><tr>${tipos.map(t=>`<th>${t[0]}</th>`).join('')}<th>Total</th></tr><tr>${tipos.map(t=>`<td>${t[1]}</td>`).join('')}<td>${ano.length}</td></tr></table>
 <h3>b) Número e tipos de exames complementares realizados</h3>${Object.keys(ex).length?`<table><tr><th>Exame complementar</th><th>Realizados</th></tr>${Object.keys(ex).map(k=>`<tr><td>${esc((EXAMES[k]||{n:k}).n)}</td><td>${ex[k]}</td></tr>`).join('')}</table>`:'<p class="small">Nenhum exame complementar registrado no período.</p>'}`;
 if(!simplif){
 h+=`<h3>c) Estatística de resultados anormais dos exames complementares, por unidade/setor/função</h3><table><tr><th>Setor</th><th>Exames realizados</th><th>Resultados anormais (a preencher pelo médico)</th></tr>${Object.keys(porSetor).length?Object.keys(porSetor).map(k=>`<tr><td>${esc(k)}</td><td>${porSetor[k]}</td><td><span class="blank"></span></td></tr>`).join(''):'<tr><td colspan="3" class="small">Sem registros no período.</td></tr>'}</table>
 <h3>d) Incidência e prevalência de doenças relacionadas ao trabalho, por unidade/setor/função</h3><p><span class="blank l"></span></p><p><span class="blank l"></span></p>
 <h3>e) CAT emitidas no período (número e tipos de eventos/doenças)</h3><p>Número de CAT emitidas: <span class="blank"></span> &nbsp;&nbsp; Tipos de eventos/doenças: <span class="blank l"></span></p>
 <h3>f) Análise comparativa com o relatório anterior e discussão das variações</h3><p><span class="blank l"></span></p><p><span class="blank l"></span></p>`;
 }else{
 h+=`<p class="small">Organização de grau de risco ${esc(e.grau||'—')} com ${cols.length} trabalhador(es): conforme o item 7.6.6 da NR-7, o relatório analítico pode limitar-se às informações das alíneas "a" e "b" acima.</p>`;
 }
 h+=`<table><tr><th>Aptos no período</th><th>Inaptos no período</th><th>Trabalhadores ativos</th><th>Sem ASO registrado no sistema</th></tr><tr><td>${ap}</td><td>${ina}</td><td>${cols.length}</td><td>${cols.filter(x=>!ultimoAso(x.id)).length}</td></tr></table><p class="small">Caso o médico coordenador não tenha recebido os prontuários médicos de exames realizados fora deste sistema, ou considere as informações insuficientes, deve registrar o fato neste relatório (item 7.6.4). O relatório deve ser apresentado e discutido com os responsáveis por segurança e saúde da organização, incluindo a CIPA quando existente (item 7.6.5).</p><h3>Análise crítica e conclusões do médico coordenador</h3><p><span class="blank l"></span></p><p><span class="blank l"></span></p><p><span class="blank l"></span></p>`;
 // cronograma
 const meses=[];for(let i=0;i<12;i++){const d=addM(today(),i).slice(0,7);meses.push({m:d,n:0})}
 let semAso=0;cols.forEach(x=>{const p=proximo(x);if(!p){semAso++;return}const m=meses.find(o=>o.m===p.slice(0,7));if(m)m.n++;else if(p<today()&&meses[0])meses[0].n++});
 h+=`<h2>11. Cronograma anual de exames periódicos</h2><p>Previsão calculada a partir da data do último ASO e da periodicidade de cada função. Exames vencidos são alocados no primeiro mês.</p><table><tr>${meses.map(o=>`<th>${o.m.slice(5)}/${o.m.slice(2,4)}</th>`).join('')}</tr><tr>${meses.map(o=>`<td>${o.n}</td>`).join('')}</tr></table>${semAso?`<p class="small">${semAso} trabalhador(es) sem ASO registrado no sistema: programar exame conforme o tipo aplicável.</p>`:''}`;
 h+=`<div class="note">Documento elaborado com base no inventário de riscos do PGR e nos dados informados pela organização. A validade legal depende da revisão técnica e da assinatura do médico coordenador indicado abaixo.</div><h2>12. Aprovação</h2><p>Local e data: ${esc(e.cidade||'__________________')}, ${fd(meta.emissao)}.</p><div class="sig"><div>${esc(e.medico_nome||'Médico coordenador do PCMSO')}<span>${esc(e.medico_crm||'CRM')}</span><span>Médico coordenador</span></div><div>${esc(e.resp_nome||'Representante da empresa')}<span>${esc(e.resp_cargo||'')}</span><span>${esc(e.razao)}</span></div></div>`;
 return h;
}

/* ---------- ASO, guia e checklist ---------- */
function docAso(s){
 const c=(s&&G('colaboradores',s.colabId))||{},e=(s&&G('empresas',s.empresaId))||{};
 const a=(s&&s.aso)||{},rs=s?riscosDoColab(c):[];
 const ex=s?(s.exames||['clinico']):['clinico'];
 const riscosTxt=a.riscos!=null?a.riscos:(rs.map(r=>r.perigo).join('; '));
 let h=dHead('ASO — Atestado de Saúde Ocupacional','NR-7');
 h+=`<h1 style="font-size:18pt">Atestado de Saúde Ocupacional (ASO)</h1>`;
 h+=`<h2>1. Empresa</h2>${kv([['Razão social',BL(e.razao)],['CNPJ',B(e.cnpj)],['Endereço',BL(endEmp(e))]])}`;
 h+=`<h2>2. Trabalhador</h2>${kv([['Nome',BL(c.nome)],['CPF',B(c.cpf)],['Data de nascimento',c.nasc?fd(c.nasc):B('')],['Função',B(c.funcao)],['Setor',B(c.setor)]])}`;
 h+=`<h2>3. Tipo de exame</h2><p class="box">${TIPOS.map(t=>`${chk(s&&s.tipo===t)} ${t}`).join('&nbsp;&nbsp; ')}</p>`;
 h+=`<h2>4. Perigos ou fatores de risco ocupacionais</h2><p>${riscosTxt?esc(riscosTxt):'<span class="blank l"></span><br><br><span class="blank l"></span>'}</p>`;
 h+=`<h2>5. Exames realizados</h2><table><tr><th>Exame</th><th style="width:22%">Data</th></tr><tr><td>${esc(EXAMES.clinico.n)}</td><td>${a.data?fd(a.data):'&nbsp;'}</td></tr>${(s?ex.filter(k=>k!=='clinico'):[]).map(k=>`<tr><td>${esc((EXAMES[k]||{n:k}).n)}</td><td>${(a.exames||{})[k]?fd(a.exames[k]):'&nbsp;'}</td></tr>`).join('')}${s?'':'<tr><td>&nbsp;</td><td></td></tr><tr><td>&nbsp;</td><td></td></tr><tr><td>&nbsp;</td><td></td></tr>'}</table>`;
 h+=`<h2>6. Conclusão</h2><p class="box">${chk(a.resultado==='Apto')} <b>Apto</b> para a função &nbsp;&nbsp;&nbsp; ${chk(a.resultado==='Inapto')} <b>Inapto</b> para a função</p>${a.obs?`<p><b>Observações:</b> ${nl(a.obs)}</p>`:'<p><b>Observações:</b> <span class="blank l"></span></p>'}<p><b>Próximo exame periódico até:</b> ${a.data?fd(a.proximo||addM(a.data,examesDe(rs).clinico||12)):'<span class="blank"></span>'}</p>`;
 h+=`<h2>7. Médicos responsáveis</h2>${kv([['Médico coordenador do PCMSO',BL((e.medico_nome||'')+(e.medico_crm?' — '+e.medico_crm:''))],['Médico examinador',BL((a.medico_nome||'')+(a.medico_crm?' — '+a.medico_crm:''))],['Data do exame',a.data?fd(a.data):B('')]])}`;
 h+=`<div class="sig"><div>Assinatura e carimbo do médico examinador<span>Nome, CRM e data</span></div><div>Ciência e recebimento do trabalhador<span>${esc(c.nome||'Nome')} — Data: ____/____/______</span></div></div>`;
 h+=`<p class="small" style="margin-top:14pt">Documento com dados de saúde sujeito a sigilo (LGPD). Uma via deve ser entregue ao trabalhador e outra arquivada pela organização.</p>`;
 return h;
}
function docGuia(s){
 const c=G('colaboradores',s.colabId)||{},e=G('empresas',s.empresaId)||{},cl=G('clinicas',s.clinicaId)||{};
 const rs=riscosDoColab(c);
 let h=dHead('Guia de encaminhamento para exame ocupacional',fd(s.dataSolic));
 h+=`<h1 style="font-size:18pt">Guia de encaminhamento</h1><p class="small">Solicitação de exame ocupacional — ${esc(s.tipo)}</p>`;
 h+=`<h2>Clínica</h2>${kv([['Clínica',esc(cl.nome||'—')],['Endereço / contato',esc([cl.endereco,cl.telefone,cl.email].filter(Boolean).join(' · ')||'—')],['Data agendada',s.dataAgend?fd(s.dataAgend):'A combinar com a empresa']])}`;
 h+=`<h2>Empresa solicitante</h2>${kv([['Razão social',esc(e.razao||'—')],['CNPJ',esc(e.cnpj||'—')],['Endereço',esc(endEmp(e)||'—')],['Contato',esc([e.resp_nome,e.telefone,e.email].filter(Boolean).join(' · ')||'—')],['Médico coordenador do PCMSO',esc((e.medico_nome||'—')+(e.medico_crm?' — '+e.medico_crm:''))]])}`;
 h+=`<h2>Trabalhador</h2>${kv([['Nome',esc(c.nome||'—')],['CPF',esc(c.cpf||'—')],['Nascimento / sexo',esc((c.nasc?fd(c.nasc):'—')+' / '+(c.sexo||'—'))],['Função / setor',esc((c.funcao||'—')+(c.setor?' · '+c.setor:''))],['Admissão',c.admissao?fd(c.admissao):'—']])}`;
 h+=`<h2>Exames solicitados</h2><table><tr><th style="width:8%">Feito</th><th>Exame</th><th style="width:38%">Motivo (riscos do PGR / PCMSO)</th></tr>${(s.exames||[]).map(k=>`<tr><td class="box">☐</td><td>${esc((EXAMES[k]||{n:k}).n)}</td><td class="small">${esc(origemExame(rs,k).join('; ')||'—')}</td></tr>`).join('')}</table>`;
 h+=`<h2>Riscos ocupacionais da função</h2>${rs.length?`<table><tr><th>Perigo / fator de risco</th><th>Categoria</th></tr>${rs.map(r=>`<tr><td>${esc(r.perigo)}</td><td>${esc(CATS[r.cat]||'')}</td></tr>`).join('')}</table>`:'<p class="small">Sem riscos específicos cadastrados para a função.</p>'}`;
 h+=`<h2>Instruções à clínica</h2><ol><li>Editar e preencher os campos do ASO em anexo e emitir o documento assinado;</li><li>Registrar o checklist psicossocial preenchido pelo trabalhador junto ao prontuário;</li><li>Enviar o ASO assinado à empresa solicitante pelo sistema (anexo do ASO) ou por e-mail.</li></ol>${s.obs?`<p><b>Observações da empresa:</b> ${nl(s.obs)}</p>`:''}<p class="small">O trabalhador deve levar documento oficial com foto e, se houver, exames anteriores.</p>`;
 h+=`<div class="sig"><div>${esc(e.resp_nome||'Responsável pela empresa')}<span>${esc(e.razao||'')}</span></div><div>Recebimento pela clínica<span>Data: ____/____/______</span></div></div>`;
 return h;
}
function docPsico(s){
 const c=(s&&G('colaboradores',s.colabId))||{},e=(s&&G('empresas',s.empresaId))||{},p=s&&s.psico;
 let n=0;
 let h=dHead('Checklist psicossocial','Triagem organizacional');
 h+=`<h1 style="font-size:18pt">Checklist psicossocial do trabalhador</h1><p class="small">Instrumento de triagem sobre fatores psicossociais do trabalho. Não é diagnóstico. As respostas são sigilosas, sujeitas ao sigilo médico e utilizadas para orientar a vigilância da saúde e o gerenciamento de riscos. Responda pensando nos últimos 3 meses.</p>`;
 h+=`${kv([['Trabalhador',BL(c.nome)],['Empresa',BL(e.razao)],['Função / setor',B((c.funcao||'')+(c.setor?' · '+c.setor:''))],['Data',p?fd(p.data):B('')]])}`;
 PSICO.forEach(g=>{
  h+=`<h3>${g.d}</h3><table class="q"><tr><th>Afirmação</th>${ESCALA.map(l=>`<th class="c" style="font-size:7pt">${l}</th>`).join('')}</tr>`+g.q.map(t=>{const i=n++,tx=t.split('|')[0];return `<tr><td>${i+1}. ${esc(tx)}</td>${ESCALA.map((l,k)=>`<td class="c box">${p&&p.resp['q'+i]==String(k)?'☒':'☐'}</td>`).join('')}</tr>`}).join('')+'</table>';
 });
 h+=`<p><b>Comentários:</b> ${p&&p.obs?esc(p.obs):'<span class="blank l"></span>'}</p>`;
 if(p)h+=`<h3>Resumo para o médico (uso da clínica)</h3><table><tr><th>Dimensão</th><th>Média (0 a 4)</th><th>Indicativo</th></tr>${psicoResumo(p).map(r=>`<tr><td>${r.d}</td><td>${r.m.toFixed(1)}</td><td><span class="tag m-${r.k}">${r.t}</span></td></tr>`).join('')}</table><p class="small">Nas afirmações positivas (autonomia, apoio, pausas), a pontuação é invertida no cálculo. Médias a partir de 1,5 indicam atenção; a partir de 2,5, atenção elevada. Interpretação por profissional habilitado.</p>`;
 h+=`<div class="sig"><div>Assinatura do trabalhador<span>Declaro que respondi com sinceridade</span></div><div>Profissional que recebeu<span>Nome, registro e data</span></div></div>`;
 return h;
}

/* ---------- visualizador ---------- */
function openDoc(d){
 S.doc=d;const r=$('#doc-root');
 r.innerHTML=`<div class="doc-bar"><b>${esc(d.title)}</b><button class="btn s p" data-a="dPrint">${ic('print')}Imprimir</button><button class="btn s" data-a="dSave">${ic('down')}Baixar</button><button class="btn s" data-a="dSend">${ic('send')}Enviar</button><button class="btn s" data-a="dClose">${ic('x')}Fechar</button></div><div class="doc-wrap"><div class="paper">${d.html}</div></div>`;
 r.classList.add('on');r.scrollTop=0;
}
function closeDoc(){S.doc=null;const r=$('#doc-root');r.classList.remove('on');r.innerHTML=''}
async function sendDoc(){
 const d=S.doc;if(!d)return;const html=standalone(d.title,d.html);
 try{const f=new File([html],d.filename,{type:'text/html'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:d.title,text:d.corpo});return}}catch(e){if(e&&e.name==='AbortError')return}
 const ok=await saveAs(d.filename,html);

  set('endereco',end.trim());
  set('cidade',j.municipio);

 }catch(e){toast('Não consegui buscar os dados pelo CNPJ agora — pode preencher manualmente.',4000)}

/* ====================== INSTALAÇÃO (PWA) ====================== */
window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault();window._deferredInstall=e;
 const b=document.getElementById('install-btn');if(b)b.classList.add('show');
});
window.addEventListener('appinstalled',()=>{
 window._deferredInstall=null;const b=document.getElementById('install-btn');if(b)b.classList.remove('show');toast('App instalado.');
});
