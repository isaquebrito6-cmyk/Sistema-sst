name: Publicar regras do Firestore

# Publica o firestore.rules no Firebase sempre que ele mudar na main.
# Requer o secret FIREBASE_SERVICE_ACCOUNT (conteúdo do .json da conta de serviço).
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
  workflow_dispatch:

jobs:
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar regras
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT não configurado."; exit 1
          fi
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          node -e "try{const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log('JSON da chave OK. Campos:',['type','project_id','private_key','client_email'].map(k=>k+':'+(j[k]?'sim':'NAO')).join(' '),'| projeto:',j.project_id,'| conta:',j.client_email)}catch(e){console.log('JSON da chave INVALIDO:',e.message);process.exit(1)}" "$RUNNER_TEMP/sa.json"
          node -e "const f=process.argv[1],fs=require('fs'),j=JSON.parse(fs.readFileSync(f,'utf8'));if(!j.type){j.type='service_account';fs.writeFileSync(f,JSON.stringify(j));console.log('Campo type adicionado.')}" "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project sst-gestao-cl --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
